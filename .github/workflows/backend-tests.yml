name: Backend tests

on:
  push:
    branches: [main, dev]
    paths:
      - "Python/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "Python/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: Python/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          # app/auth.py fails fast at import time without this -- everything
          # else (Razorpay, Resend, Anthropic) only checks when actually
          # invoked, and the tests mock around those. CI-only placeholder,
          # never used for anything real.
          JWT_SECRET: ci-test-secret-not-for-production
        run: python -m unittest discover tests -v
